<div
  class="min-h-screen flex flex-col justify-center items-center px-4 sm:px-0"
>
  <div class="bg-auto p-4 sm:p-8 rounded-lg shadow-lg w-full max-w-2xl">
    <h1 class="mb-6 text-center text-2xl sm:text-3xl font-bold">
      Crea un account
    </h1>

    <form [formGroup]="form" (ngSubmit)="signup()">
      <div class="flex flex-wrap -mx-2">
        <div class="mb-4 sm:w-1/2 w-full px-2">
          <label class="block required">Nome</label>
          <input type="text" class="w-full" formControlName="name" />
        </div>
        <div class="mb-4 sm:w-1/2 w-full px-2">
          <label class="block required">Cognome</label>
          <input type="text" class="w-full" formControlName="surname" />
        </div>

        <div class="mb-4 w-full px-2">
          <label class="block required">Codice fiscale</label>
          <input
            type="text"
            class="w-full uppercase"
            maxlength="16"
            formControlName="cf"
          />
          <p class="text-secondary text-sm">Ti servirà per accedere.</p>
        </div>

        <div class="mb-4 sm:w-1/2 w-full px-2">
          <label class="block required">Telefono</label>
          <input type="tel" class="w-full" formControlName="phoneNumber" />
        </div>
        <div class="mb-4 sm:w-1/2 w-full px-2">
          <label class="block">Email</label>
          <input type="email" class="w-full" formControlName="email" />
        </div>

        <div class="mb-4 sm:w-1/2 w-full px-2">
          <label class="block required">Password</label>
          <input type="password" class="w-full" formControlName="password" />
          <p class="text-secondary text-sm">Almeno 8 caratteri.</p>
        </div>
        <div class="mb-4 sm:w-1/2 w-full px-2">
          <label class="block required">Conferma password</label>
          <input
            type="password"
            class="w-full"
            formControlName="confirmPassword"
          />
          @if (form.hasError('passwordsMismatch') &&
          form.get('confirmPassword')?.dirty) {
          <p class="text-error text-sm">Le password non coincidono.</p>
          }
        </div>
      </div>

      <button
        type="submit"
        class="w-full button-primary transition"
        [disabled]="!form.valid || submitting()"
      >
        Registrati
      </button>
    </form>

    <!-- Link per tornare al login -->
    <div class="text-center mt-4 text-sm sm:text-base">
      Hai già un account?
      <a routerLink="/login">Accedi</a>
    </div>
  </div>

  <a
    routerLink="/"
    class="fixed top-2 left-2 sm:top-4 sm:left-4 button-secondary shadow-lg transition text-sm sm:text-base"
  >
    <fa-icon [icon]="faArrowLeft" />
    <span class="ml-1">Torna alla home</span>
  </a>

  @if (error(); as error) {
  <div
    class="bg-neon-error p-3 rounded-lg mt-4 shadow-lg w-full max-w-md text-center text-sm sm:text-base"
  >
    {{ error }}
  </div>
  }
</div>

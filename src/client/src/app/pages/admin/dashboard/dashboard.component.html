<app-navbar></app-navbar>
<div class="container min-h-4/5">
  <header class="mb-6">
    <h1>Dashboard Admin</h1>
    <p class="text-secondary">
      Gestisci il tuo oratorio in modo semplice ed efficace
    </p>
  </header>

  <!-- Cards Overview -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
    <div class="bg-auto p-4 rounded-lg shadow">
      <h2>Utenti nella rubrica</h2>
      <p class="text-2xl font-bold">{{ peopleCount }}</p>
    </div>
    <div class="bg-auto p-4 rounded-lg shadow">
      <h2>Iscritti Totali</h2>
      <p class="text-2xl font-bold">{{ enrollmentsCount }}</p>
    </div>
    <div class="bg-auto p-4 rounded-lg shadow">
      <h2>Presenze oggi</h2>
      <p class="text-2xl font-bold">{{ attendanceCount }}</p>
    </div>
  </div>
</div>

<app-footer></app-footer>

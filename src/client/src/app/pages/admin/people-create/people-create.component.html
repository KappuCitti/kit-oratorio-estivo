<app-navbar></app-navbar>
<div class="container min-h-4/5">
  <header class="mb-6">
    <h1>Nuova famiglia</h1>
    <p class="text-secondary">
      Cera una nuova famiglia selezionandone i componenti
    </p>
  </header>

  <div class="bg-auto p-4 rounded-lg shadow-lg mb-6">
    <div class="flex justify-between mb-2">
      <h2>Componenti</h2>
    </div>

    <div class="flex flex-wrap -mx-2">
      <div class="mb-2 sm:w-1/2 w-full px-2">
        <label class="block required"
          >Numero di genitori ({{ parents.length }})</label
        >
        <input
          type="range"
          class="w-full px-0"
          min="1"
          max="2"
          step="1"
          [ngModel]="parents.length"
          (ngModelChange)="changeArrayLength(parents, $event)"
        />
      </div>
      <div class="mb-2 sm:w-1/2 w-full px-2">
        <label class="block required"
          >Numero di figli ({{ childs.length }})</label
        >
        <input
          type="range"
          class="w-full px-0"
          min="1"
          max="10"
          step="1"
          [ngModel]="childs.length"
          (ngModelChange)="changeArrayLength(childs, $event)"
        />
      </div>
    </div>
  </div>

  <div class="w-full bg-auto p-4 rounded-lg shadow-lg mb-6">
    @for (p of parents; track idx; let idx = $index) {
    <app-parent
      (parentChange)="onParentChange($event, idx)"
      [editable]="true"
      (isValid)="onIsParentValidChange($event, idx)"
    ></app-parent>
    <div class="my-8"></div>
    } @for (c of childs; track idx; let idx = $index) {
    <app-child
      (childChange)="onChildChange($event, idx)"
      [editable]="true"
      (isValid)="onIsChildValidChange($event, idx)"
    ></app-child>
    <div
      [ngClass]="{ 'my-6': idx == childs.length, 'my-8': idx != childs.length }"
    ></div>
    }

    <div class="flex justify-end">
      <button
        class="button-primary"
        [disabled]="!isFieldsValid()"
        (click)="onCreateFamily()"
      >
        Crea
      </button>
    </div>

    @if (error) {
    <div class="flex justify-center items-center">
      <div
        class="bg-neon-error p-3 rounded-lg shadow-lg w-full max-w-md text-center"
      >
        {{ error }}
      </div>
    </div>
    }
  </div>
</div>
<app-footer></app-footer>

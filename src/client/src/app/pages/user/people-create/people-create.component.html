<app-navbar />
<div class="container min-h-4/5">
  <header class="mb-6 flex items-center justify-between">
    <div>
      <h1>Aggiungi un ragazzo</h1>
      <p class="text-secondary">
        Dopo averlo aggiunto potrai iscriverlo all'oratorio estivo
      </p>
    </div>
    <a class="button-secondary" [routerLink]="['/user/people']">
      <fa-icon [icon]="faArrowLeft" />
      Famiglia
    </a>
  </header>

  <form [formGroup]="form">
    <div class="bg-auto p-4 rounded-lg shadow-lg mb-6">
      <h2 class="mb-4">Anagrafica</h2>
      <div class="flex flex-wrap -mx-2">
        <div class="mb-4 sm:w-1/2 w-full px-2">
          <label class="block required">Nome</label>
          <input type="text" class="w-full" formControlName="name" />
        </div>
        <div class="mb-4 sm:w-1/2 w-full px-2">
          <label class="block required">Cognome</label>
          <input type="text" class="w-full" formControlName="surname" />
        </div>
        <div class="mb-4 sm:w-1/2 w-full px-2">
          <label class="block required">Codice fiscale</label>
          <input
            type="text"
            class="w-full uppercase"
            maxlength="16"
            formControlName="cf"
          />
        </div>
        <div class="mb-4 sm:w-1/2 w-full px-2">
          <label class="block required">Sesso</label>
          <select class="w-full" formControlName="gender">
            <option value="M">Maschio</option>
            <option value="F">Femmina</option>
          </select>
        </div>
        <div class="mb-4 sm:w-1/2 w-full px-2">
          <label class="block required">Data di nascita</label>
          <input type="date" class="w-full" formControlName="birthDate" />
        </div>
        <div class="mb-4 sm:w-1/2 w-full px-2">
          <label class="block required">Luogo di nascita</label>
          <input type="text" class="w-full" formControlName="birthPlace" />
        </div>
      </div>
    </div>

    <div class="bg-auto p-4 rounded-lg shadow-lg mb-6">
      <h2 class="mb-4">Residenza</h2>
      <div class="flex flex-wrap -mx-2">
        <div class="mb-4 w-full px-2">
          <label class="block required">Via e numero civico</label>
          <input type="text" class="w-full" formControlName="street" />
        </div>
        <div class="mb-4 sm:w-1/3 w-full px-2">
          <label class="block required">Città</label>
          <input type="text" class="w-full" formControlName="city" />
        </div>
        <div class="mb-4 sm:w-1/3 w-full px-2">
          <label class="block required">CAP</label>
          <input type="text" class="w-full" formControlName="postalCode" />
        </div>
        <div class="mb-4 sm:w-1/3 w-full px-2">
          <label class="block required">Nazione</label>
          <input type="text" class="w-full" formControlName="country" />
        </div>
      </div>
    </div>

    <div class="bg-auto p-4 rounded-lg shadow-lg mb-6">
      <h2 class="mb-2">Accesso</h2>
      <p class="text-secondary mb-4">
        Anche il ragazzo ha un proprio account, con il codice fiscale come nome
        utente.
      </p>
      <div class="flex flex-wrap -mx-2">
        <div class="mb-4 sm:w-1/2 w-full px-2">
          <label class="block">Email</label>
          <input type="email" class="w-full" formControlName="email" />
        </div>
        <div class="mb-4 sm:w-1/2 w-full px-2">
          <label class="block required">Password</label>
          <input type="password" class="w-full" formControlName="password" />
          <p class="text-secondary text-sm">Almeno 8 caratteri.</p>
        </div>
      </div>
    </div>
  </form>

  <div class="flex justify-end mb-6">
    <button
      class="px-4 py-2 button-primary"
      [disabled]="form.invalid || saving()"
      (click)="save()"
    >
      Aggiungi
    </button>
  </div>

  @if (error(); as messaggio) {
  <div class="bg-neon-error p-3 rounded-lg shadow-lg mb-6 text-center">
    {{ messaggio }}
  </div>
  }
</div>
<app-footer />
